<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Oxente Bar e Petiscaria — comida baiana, petiscos e cerveja gelada.">
  <meta name="theme-color" content="#1b0b04">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png">
  <title>Oxente Bar e Petiscaria — Bem-vindo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Lobster+Two:ital,wght@1,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="icon" href="public/assets/oxente-logo-oficial.jpg" type="image/jpeg">
  <link rel="stylesheet" href="public-ui.css?v=app-nav-3">
  <link rel="stylesheet" href="home.css?v=logo-cliente-1">
</head>
<body class="home-page">
  <main class="home-shell">
    <header class="home-hero" aria-label="Apresentação do Oxente Bar e Petiscaria">
      <img id="brandLogo" class="brand-logo" src="public/assets/oxente-logo-cliente.png" alt="Oxente Bar e Petiscaria" width="1350" height="1165" fetchpriority="high" decoding="async">
      <h1 id="homeTagline" class="tagline"><span>Barzinho do jeito que</span> <em>você gosta!</em></h1>
      <p id="homeIntro" class="hero-intro">Comida boa, cerveja gelada e muita resenha em um só lugar.</p>
      <div id="homeStatus" class="home-status" aria-live="polite">CONSULTANDO HORÁRIO</div>
      <p id="homeSchedule" class="home-schedule" aria-live="polite" hidden>
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="6" width="21" height="21" rx="3" fill="none" stroke="currentColor" stroke-width="2.3"/><path d="M4 12h21M10 3v6M20 3v6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><circle cx="22" cy="23" r="7" fill="#241005" stroke="currentColor" stroke-width="2"/><path d="M22 19v4l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <i class="schedule-divider" aria-hidden="true"></i><span class="schedule-copy"></span>
      </p>
    </header>

    <section class="actions" aria-label="Acessos do Oxente Bar e Petiscaria">
      <a id="menuLink" class="action action--menu" href="cardapio/" aria-label="Abrir Delícias do Oxente no cardápio">
        <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 80 80"><defs><linearGradient id="home-cloche" x2="0" y2="1"><stop stop-color="#ffe988"/><stop offset=".5" stop-color="#ffcb28"/><stop offset="1" stop-color="#b96a0d"/></linearGradient></defs><path d="M26 14c-4-5 3-7 0-12M40 15c-4-5 3-7 0-12M54 14c-4-5 3-7 0-12" fill="none" stroke="#ffe296" stroke-width="2.4" stroke-linecap="round"/><path d="M39 25v-5M34 20h12" fill="none" stroke="url(#home-cloche)" stroke-width="3.5" stroke-linecap="round"/><path d="M17 52c1-16 10-27 23-27s22 11 23 27Z" fill="url(#home-cloche)" stroke="#ffe39a" stroke-width="2.2"/><path d="M13 56h54M19 63h42" fill="none" stroke="url(#home-cloche)" stroke-width="4.5" stroke-linecap="round"/></svg></span>
        <span class="action-copy"><strong>Delícias <em>do Oxente</em></strong></span>
        <span class="action-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <div id="serviceLinks" class="service-grid" aria-live="polite"><div class="service-placeholder">Carregando opções da casa…</div></div>
      <p id="homeNotice" class="home-notice" hidden></p>
    </section>

    <div class="ornament" aria-hidden="true"><span></span><b>★ ★ ★</b><span></span></div>
    <footer class="home-footer"><strong id="brandName">OXENTE BAR E PETISCARIA</strong><small>AMBIENTE ACONCHEGANTE <i>♦</i> PETISCOS <i>♦</i> CERVEJA GELADA</small></footer>
  </main>
  <dialog id="videoDialog" class="video-dialog" aria-label="Vídeo de apresentação"><button id="videoClose" type="button" aria-label="Fechar vídeo">×</button><div id="videoHost"></div></dialog>
  <script defer src="data/menu.js"></script>
  <script defer src="data/runtime-config.js"></script>
  <script defer src="public/vendor/supabase.js"></script>
  <script defer src="data/hours.js"></script>
  <script defer src="data/store.js"></script>
  <script defer src="home.js?v=logo-cliente-2"></script>
  <script defer src="video.js"></script>
  <script defer src="public-ui.js?v=app-nav-3"></script>
  <script>
    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) { refreshing = true; location.reload(); }
      });
    }
  </script>
</body>
</html>
